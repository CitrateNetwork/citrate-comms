name: rust-deps-audit

# Dependency-advisory gate for the Rust workspace, on every PR and push to main,
# plus a weekly run so a newly published advisory against an unchanged lockfile
# still turns the gate red. Before this, the only Rust advisory check was the
# tag-triggered `cargo audit` step in release.yml, so nothing ran pre-merge.
#
# Runs scripts/ci/audit.sh (cargo deny: advisories + bans + sources, and cargo audit
# with .cargo/audit.toml) against the committed deny.toml — the same posture as citrate-chain's cargo-audit.yml and
# nist-agent's ci.yml `deny` job. Accepted advisories are reviewed
# `[advisories] ignore` entries in deny.toml; version floors for releases the
# advisory DB does not cover yet are `[bans] deny` entries there. Never add a
# continue-on-error here.

on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 08:00 UTC (same cadence as citrate-chain).
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rust-deps-audit-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo deny (advisories, bans, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # cargo-deny resolves the graph with `cargo metadata`; use the pinned toolchain.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.96.0"

      # Unpinned on purpose (as in nist-agent): an old cargo-deny cannot parse newer
      # RustSec advisory formats, which would silently weaken the gate.
      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-deny,cargo-audit

      - name: Advisory gate
        run: bash scripts/ci/audit.sh

# cargo-deny config for citrate-comms (COMMS-S4 WP-4.7).
#
# Mirrors the citrate-chain / nist-agent supply-chain posture: the `licenses.allow` list
# is the smallest set that permits the current dependency graph. Adding a license requires
# a PR that updates this file, forcing reviewers to confirm it is redistribution-safe.
#
# `cargo audit` BLOCKS the release (no soft-fail); accepted advisories are explicit,
# reviewed `[advisories] ignore` entries here — never a continue-on-error step.

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities are the gate (they fail closed unless explicitly ignored below).
# `unmaintained` is scoped to first-party workspace crates only: deep transitive
# `unmaintained` notices (paste, proc-macro-error2, rustybuzz, ttf-parser — all from
# the macro / Slint desktop stack) are hygiene tracking, not a supply-chain STOP, and
# must not mask a real vulnerability behind a red gate. Widen this when they are owned.
unmaintained = "workspace"
ignore = [
    # ── CM2-B-A006 (HELD) — libcrux advisories under the MLS crypto provider ──
    # The MLS transport is openmls 0.8 → openmls_rust_crypto 0.5.1 → hpke-rs 0.6.1,
    # whose `hpke-rs-libcrux 0.6.1` pins the vulnerable `libcrux-* 0.0.x` line
    # (`libcrux-aead = "^0.0.7"`, etc). The fixed libcrux versions are UNREACHABLE
    # without bumping hpke-rs / openmls_rust_crypto — a crypto-provider MAJOR bump
    # that carries an OpenMLS API migration and MUST NOT be rushed into a fix pass.
    # Tracked as a HELD dependency; remove each entry as the provider bump lands.
    # (Verified 2026-09-06: `cargo update -p <crate> --precise <fixed>` is refused,
    #  "required by package hpke-rs v0.6.1".)
    #
    # RUSTSEC-2026-0207 — libcrux-sha3: incorrect incremental SHAKE (fix >=0.0.10, blocked)
    "RUSTSEC-2026-0207",
    # RUSTSEC-2026-0208 — libcrux-sha3: panic in AVX2 SHAKE-256 (fix >=0.0.10, blocked)
    "RUSTSEC-2026-0208",
    # RUSTSEC-2026-0212 — libcrux-secrets: incorrect aarch64 ct-swap/select (fix >=0.0.6, blocked)
    "RUSTSEC-2026-0212",
    # RUSTSEC-2026-0124 — libcrux-chacha20poly1305: panic on overlong ct (fix >=0.0.8, blocked)
    "RUSTSEC-2026-0124",
    # RUSTSEC-2026-0211 — libcrux-aesgcm: non-constant-time AES-GCM tag check. NO FIX
    #   available upstream. Reachable on the live AEAD path; the residual timing oracle
    #   is accepted only until the provider bump / a RustCrypto AEAD backend swap.
    "RUSTSEC-2026-0211",
    # RUSTSEC-2026-0209 — libcrux-aesgcm: AAD length not bounded. NO FIX available.
    "RUSTSEC-2026-0209",
    # ── Desktop-client (Slint) surface — NOT the crypto core; tracked, out of A006 ──
    # quick-xml reaches the tree ONLY via Slint's wayland/zbus stack (desktop client),
    # not the relay or crypto core. No semver-compatible fix is reachable (Slint pins
    # the older line); remove when Slint bumps quick-xml to >=0.41.
    # RUSTSEC-2026-0194 — quick-xml: quadratic duplicate-attribute check (desktop)
    "RUSTSEC-2026-0194",
    # RUSTSEC-2026-0195 — quick-xml: unbounded namespace-decl allocation (desktop)
    "RUSTSEC-2026-0195",
    # ── crypto-bigint 0.5 timing advisory — time-boxed, EXPIRES 2027-01-31 ──
    # RUSTSEC-2026-0387 — crypto-bigint < 0.7.6: some operations intended to be
    # constant-time could branch on secret data depending on compiler and target.
    # Library-level advisory; fixed only in 0.7.6, no 0.5.x backport. crypto-bigint
    # 0.5.5 is pulled only by elliptic-curve 0.13 (k256 0.13 in comms-core; k256 /
    # p256 / p384 0.13 via hpke-rs-rust-crypto and openmls_rust_crypto). No 0.13
    # curve release accepts 0.7, and no published openmls_rust_crypto accepts the
    # 0.14 curve line, so this is upstream-blocked; the upgrade is tracked.
    # Enforced by scripts/ci/check-crypto-bigint-users.py (run by scripts/ci/audit.sh):
    # fails if a crate other than elliptic-curve depends on an unpatched crypto-bigint,
    # if this ignore goes stale, or after 2027-01-31 while it is still here.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via elliptic-curve 0.13 only; upstream-blocked; expires 2027-01-31" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    # CDLA-Permissive-2.0 — pulled in by webpki-roots (the client's wss:// TLS roots).
    "CDLA-Permissive-2.0",
    # GPL-3.0 / Slint's royalty-free desktop-distribution license. The comms-client
    # Slint surface is shipped as an end-user desktop app; review Slint's licensing
    # terms before any commercial redistribution.
    "GPL-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path deps (`path = "../x"`, no version) are intra-repo, not registry
# wildcards; registry and git wildcards stay denied.
allow-wildcard-paths = true
# Minimum-version floors for crates whose patched release is not (yet) in the
# RustSec database, so `advisories` alone would not hold the line. Each entry is a
# floor, not a pin: any version at or above it passes. Remove an entry once the
# advisory DB covers it.
deny = [
    { crate = "openmls:<0.8.2", reason = "dependency update to the patched release; keep >= 0.8.2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

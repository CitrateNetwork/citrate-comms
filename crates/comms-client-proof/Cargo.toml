[package]
name = "comms-client-proof"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "citrate-comms visual proof harness — renders the client's Slint screens headless via MinimalSoftwareWindow::take_snapshot() to committed golden PNGs (COMMS-S5). Mirrors citrate-defense_prime-shell's *_proof pattern."

[dependencies]
# Software renderer + a custom test Platform → headless PNG snapshots, no display.
slint = { version = "1.16", default-features = false, features = ["std", "renderer-software", "compat-1-2"] }

[build-dependencies]
slint-build = "1.16"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

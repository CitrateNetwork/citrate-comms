[package]
name = "comms-agent-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "citrate-comms agent bridge — Unix-socket JSON-per-line IPC to nist-agent / citrate-agent-runtime; runs an agent's MLS client so the agent participates as a cryptographic member."

[dependencies]
comms-proto = { path = "../comms-proto" }
comms-core = { path = "../comms-core" }
# The bridge runs the agent's MLS client and talks to the server-blind relay.
comms-relay = { path = "../comms-relay" }
thiserror = { workspace = true }
serde = { workspace = true }
hex = "0.4"
# Unix-socket IPC framing mirrors nist-agent-daemon/src/ipc.rs (JSON-per-line).
serde_json = "1"

[dev-dependencies]
blake3 = { workspace = true }

[package]
name = "comms-wire"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "citrate-comms relay wire protocol — CBOR frames, the RelayClient connector, and the endpoint-security guard. Client half only: no storage engine, no admin surface, and no MLS, so a client cannot decrypt and a relay cannot be linked by accident."

[dependencies]
comms-proto = { path = "../comms-proto" }
# default-features = false → NO `mls` and NO `store`. This crate handles ciphertext
# and routing metadata only; the dependency graph is what makes that true rather
# than a convention (PLANSET/02 §1).
comms-core = { path = "../comms-core", default-features = false }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = "0.3"
# rustls 0.23 dropped the automatic default CryptoProvider; with both `ring` and `aws-lc-rs`
# in the tree it can't pick one and PANICS on the first wss:// dial. We install `ring`
# explicitly (once) before connecting — see client.rs. Pin the provider here.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
tokio = { workspace = true }

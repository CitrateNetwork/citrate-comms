[package]
name = "comms-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "citrate-comms domain library — MLS engine, SIWE→MLS identity binding, RBAC, CRM/PM domain, encrypted store, BLAKE3 audit chain."

[features]
# `mls` gates the OpenMLS-dependent client engine. The relay depends on this crate
# with `default-features = false, features = ["store"]`, so a build SCOPED TO THE RELAY
# does not compile the MLS module in — the server-blind invariant (PLANSET/02 §1).
#
# The scoping is load-bearing and was previously stated too absolutely. Cargo unifies
# features across a build: `cargo build --workspace` resolves this crate to `mls +
# store`, because comms-client asks for it, and the relay links THAT artifact.
# Measured 2026-08-01 — workspace-built relay: 39 OpenMLS symbol references;
# `-p comms-relay`: 0.
#
# This does not let the relay read anything (it holds no group secrets and never calls
# the engine), but "cannot link it" is only true of a package-scoped build. Both deploy
# paths use `-p comms-relay`, and `deploy/bootstrap-droplet.sh` now verifies the built
# binary before installing it, rather than trusting the invocation.
default = ["mls", "store"]
mls = ["dep:openmls", "dep:openmls_rust_crypto", "dep:openmls_traits", "dep:openmls_basic_credential", "dep:tls_codec"]
# `store` gates the RocksDB + AES-256-GCM-SIV persistence layer (used by the relay).
store = ["dep:rocksdb", "dep:aes-gcm-siv", "dep:getrandom"]

[dependencies]
comms-proto = { path = "../comms-proto" }
serde = { workspace = true }
ciborium = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
blake3 = { workspace = true }
sha3 = { workspace = true }
hex = "0.4"
# secp256k1 ECDSA + public-key recovery for the SIWE handshake and the wallet
# binding attestation (the wallet identity is an Ethereum key).
k256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# MLS engine (feature-gated).
openmls = { workspace = true, optional = true }
openmls_rust_crypto = { workspace = true, optional = true }
openmls_traits = { workspace = true, optional = true }
openmls_basic_credential = { version = "0.5", optional = true }
tls_codec = { version = "0.4", optional = true }

# Persistence (feature `store`).
rocksdb = { workspace = true, optional = true }
aes-gcm-siv = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

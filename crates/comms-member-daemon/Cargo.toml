[package]
name = "comms-member-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "citrate-comms member daemon — runs a wallet-owned MLS member + an in-process server-blind relay, exposing a loopback UDS JSON IPC so a lean client (citrate-core Commons) drives Groups without linking the MLS/relay tree."

[[bin]]
name = "comms-member-daemon"
path = "src/main.rs"

[dependencies]
comms-proto = { path = "../comms-proto" }
comms-core = { path = "../comms-core" }
comms-relay = { path = "../comms-relay" }
# The networked relay client (WS) for cross-node groups — WsRelay. The heavy tree stays in this
# sidecar, out of citrate-core's src-tauri (the lean-tree boundary).
comms-wire = { path = "../comms-wire" }
tokio = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
hex = "0.4"
# Constant-time bearer comparison (no `==` on the loopback IPC token).
subtle = { workspace = true }
# Wipe the wallet seed copies from memory on drop (CM2-B-A009).
zeroize = { workspace = true }
# Durable MLS state at rest (issue #3). PURE-RUST AEAD only — the daemon must keep
# cross-compiling to x86_64-pc-windows-*, so we deliberately do NOT pull comms-core's
# `store` feature (RocksDB). AES-256-GCM-SIV (RFC 8452) is nonce-misuse-resistant, and
# `getrandom` supplies the per-write nonce. Both are pure Rust.
aes-gcm-siv = { workspace = true }
getrandom = { workspace = true }
# CBOR for the (encrypted) group-registry snapshot record.
ciborium = { workspace = true }

[dev-dependencies]
tempfile = "3"

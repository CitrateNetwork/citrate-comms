[package]
name = "comms-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "citrate-comms server-blind relay — WebSocket delivery service, KeyPackage directory, ciphertext store, per-group total order, BLAKE3 audit log."

[dependencies]
comms-proto = { path = "../comms-proto" }
# default-features = false → the `mls` module is NOT compiled into the relay (the
# server-blind invariant, enforced by the dependency graph — PLANSET/02 §1). We DO
# enable `store` for the RocksDB AES-256-GCM persistence layer.
comms-core = { path = "../comms-core", default-features = false, features = ["store"] }
blake3 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
hex = "0.4"
# FWA-C11-07: SHA-256 for the non-reversible admin-token log fingerprint.
sha2 = { workspace = true }
# WebSocket transport.
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = "0.3"
# Loopback admin surface.
axum = { workspace = true }
getrandom = { workspace = true }
# Constant-time bearer-token comparison.
subtle = { workspace = true }

# OS keyring for the at-rest master key — native backend per platform.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
# EthWallet for the admin/ws tests (identity only — no mls/store needed).
comms-core = { path = "../comms-core", default-features = false }
# E-5 WP-3: CBOR Value introspection for the Notify metadata-only schema test.
ciborium = { workspace = true }

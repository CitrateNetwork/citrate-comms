[package]
name = "comms-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "citrate-comms server-blind relay — WebSocket delivery service, KeyPackage directory, ciphertext store, per-group total order, BLAKE3 audit log."

[dependencies]
comms-proto = { path = "../comms-proto" }
# default-features = false → the `mls` module is NOT compiled into the relay.
# The relay therefore cannot name comms_core::mls or hold any group secret: the
# server-blind invariant is enforced by the dependency graph (PLANSET/02 §1).
comms-core = { path = "../comms-core", default-features = false }
blake3 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]

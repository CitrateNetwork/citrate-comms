[package]
name = "comms-client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "citrate-comms native desktop client — Slint app on @citrate-ui-kit; MLS client + local encrypted store."

[[bin]]
name = "citrate-comms"
path = "src/main.rs"

[dependencies]
comms-proto = { path = "../comms-proto" }
comms-core = { path = "../comms-core" }
# Native UI. The screens are translated from the Claude Design handoff bundle
# (design/handoff/) against the brand tokens. @citrate-ui-kit can be swapped in later;
# for now the kit primitives are recreated locally in ui/ with identical token names.
slint = { workspace = true }

[build-dependencies]
slint-build = "1.16"

[dev-dependencies]
# The end-to-end COMMS-S0 test runs a real MLS client (comms-core, mls feature on by
# default) through an in-process server-blind relay. This is the natural home for it:
# the client legitimately uses both the MLS engine and the relay.
comms-proto = { path = "../comms-proto" }
comms-core = { path = "../comms-core" }
comms-relay = { path = "../comms-relay" }
blake3 = { workspace = true }
tokio = { workspace = true }

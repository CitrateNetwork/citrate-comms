[package]
name = "comms-client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "citrate-comms native desktop client — Slint app on @citrate-ui-kit; MLS client + local encrypted store."

[[bin]]
name = "citrate-comms"
path = "src/main.rs"

[dependencies]
comms-proto = { path = "../comms-proto" }
comms-core = { path = "../comms-core" }
# The client drives an in-process server-blind relay + a real MLS group + the domain
# store (src/backend.rs), so the screens render LIVE decrypted data, not static fixtures.
comms-relay = { path = "../comms-relay" }
# The member session (login / KeyPackage / channels / send / receive) lives in
# comms-session now, so an app without a UI toolkit can hold one. `src/net.rs` is a
# re-export; the behaviour here is unchanged.
comms-session = { path = "../comms-session" }
blake3 = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
hex = "0.4"
# rustls 0.23 requires a process-default crypto provider to be installed before any wss://
# connection — without it the client PANICS on connect. We install the `ring` provider at
# session start (src/net.rs::ensure_tls_provider). `ring` is pure/portable (no cmake).
rustls = { version = "0.23", features = ["ring"] }
# Native UI. Screens translated from the Claude Design handoff (design/handoff/) against
# the brand tokens; @citrate-ui-kit can be swapped in for the locally-recreated primitives.
# `unstable-fontique-08` lets us register the embedded brand fonts at runtime.
slint = { workspace = true, features = ["unstable-fontique-08"] }
# The networked session (src/net.rs) drives a real MLS client against a REMOTE relay over
# wss://; a background tokio runtime carries the async RelayClient for the Slint UI.
tokio = { workspace = true }

[build-dependencies]
slint-build = "1.16"

[dev-dependencies]
# Headless UI test harness: layout geometry (size/position), element queries, and
# synthetic clicks — no display required (COMMS-S5 UI/UX hardening).
i-slint-backend-testing = "1.16"
# The end-to-end COMMS-S0 test runs a real MLS client (comms-core, mls feature on by
# default) through an in-process server-blind relay. This is the natural home for it:
# the client legitimately uses both the MLS engine and the relay.
comms-proto = { path = "../comms-proto" }
comms-core = { path = "../comms-core" }
comms-relay = { path = "../comms-relay" }
# The member session (login / KeyPackage / channels / send / receive) lives in
# comms-session now, so an app without a UI toolkit can hold one. `src/net.rs` is a
# re-export; the behaviour here is unchanged.
comms-session = { path = "../comms-session" }
blake3 = { workspace = true }
tokio = { workspace = true }
